<VirtualHost *:80>
  ServerName yourdomain.com
  ServerAlias www.yourdomain.com
  DocumentRoot /var/www/urbanstep/public
  <Directory /var/www/urbanstep/public>
      AllowOverride All
      Require all granted
  </Directory>
  ErrorLog /var/www/urbanstep/storage/logs/apache_error.log
  CustomLog /var/www/urbanstep/storage/logs/apache_access.log combined
</VirtualHost>

<VirtualHost *:443>
  ServerName yourdomain.com
  DocumentRoot /var/www/urbanstep/public
  SSLEngine on
  SSLCertificateFile /etc/letsencrypt/live/yourdomain.com/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/yourdomain.com/privkey.pem
  Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
